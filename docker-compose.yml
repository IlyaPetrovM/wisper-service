services:
  whisper-service:
    build: .
    image: whisper-service:0.1.0
    container_name: whisper-service
    ports:
      - "8000:8000"
    volumes:
      # Хранение моделей на хосте для переиспользования между перезапусками
      - ./app/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
